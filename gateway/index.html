<!doctype html>
<html lang="cs">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Platform – rozcestník</title>

<style>
body {
    max-width: 760px;
    margin: 3rem auto;
    padding: 0 1rem;
    font: 16px system-ui, sans-serif;
    color: #20232a;
}

h1 {
    margin-bottom: .3rem;
}

#status {
    color: #555;
}

.services {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(210px, 1fr)
    );
    gap: 12px;
    margin-top: 1.5rem;
}

.service {
    padding: 1.1rem;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: #fafafa;
}

.service strong {
    display: block;
    margin-bottom: .4rem;
}

.service small {
    color: #666;
}

.actions {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-top: 0.8rem;
}

.actions button {
    padding: 0.45rem 0.65rem;
    cursor: pointer;
}

.actions button:disabled {
    cursor: default;
    opacity: 0.5;
}
</style>

</head>

<body>

<h1>AI Platform</h1>

<p id="status">Načítám identitu…</p>

<p>
    Uživatel:
    <strong id="username">–</strong>
    <br>

    Konektor:
    <span id="connector">–</span>
</p>

<h2>Služby</h2>

<section class="services">

    <div class="service">
        <strong>Správce souborů – SalamanderRS</strong>
        <small id="salamander-status" role="status">Zjišťuji stav…</small>
        <div class="actions">
            <button id="salamander-start" disabled>Spustit</button>
            <button id="salamander-open" disabled>Otevřít</button>
            <button id="salamander-stop" disabled>Ukončit</button>
        </div>
    </div>

    <div class="service">
        <strong>ComfyUI</strong>
        <small>Spouštění připravujeme</small>
    </div>

    <div class="service">
        <strong>Ollama / Open WebUI</strong>
        <small>Spouštění připravujeme</small>
    </div>

    <div class="service">
        <strong>ACE-Step</strong>
        <small>Spouštění připravujeme</small>
    </div>

    <div class="service">
        <strong>Šifrované prostory</strong>
        <small>Ovládání připravujeme</small>
    </div>

    <div class="service">
        <strong>Rezervace GPU</strong>
        <small>Kalendář připravujeme</small>
    </div>

</section>

<script>
fetch('/api/me', {cache: 'no-store'})
    .then(response => {
        if (!response.ok) {
            throw new Error('Gateway API unavailable');
        }

        return response.json();
    })
    .then(data => {
        document.getElementById(
            'username'
        ).textContent = data.user.username;

        document.getElementById(
            'connector'
        ).textContent = data.connector.node_name;

        document.getElementById(
            'status'
        ).textContent = 'Připojeno';
        refreshSalamander();
    })
    .catch(() => {
        document.getElementById(
            'status'
        ).textContent = 'Nepodařilo se načíst identitu.';
    });

const salamanderStart = document.getElementById('salamander-start');
const salamanderOpen = document.getElementById('salamander-open');
const salamanderStop = document.getElementById('salamander-stop');
const salamanderStatus = document.getElementById('salamander-status');
let salamanderUrl = null;
let salamanderBusy = false;

function updateSalamander(data) {
    const registered = data.registered === true;
    const running = registered && data.status === 'running';
    salamanderUrl = running && typeof data.url === 'string' ? data.url : null;
    salamanderStart.disabled = salamanderBusy || !registered || running;
    salamanderOpen.disabled = salamanderBusy || !running || !salamanderUrl;
    salamanderStop.disabled = salamanderBusy || !running;
    salamanderStatus.textContent = !registered ? 'Aplikace zatím není přiřazena' :
        running ? 'Spuštěno' : data.status === 'stopped' ? 'Vypnuto' :
        'Stav: ' + data.status;
}

async function refreshSalamander() {
    try {
        const response = await fetch('/api/salamander', {cache: 'no-store'});
        if (!response.ok) throw new Error('Nelze načíst stav aplikace');
        updateSalamander(await response.json());
    } catch (error) {
        salamanderStart.disabled = true;
        salamanderOpen.disabled = true;
        salamanderStop.disabled = true;
        salamanderStatus.textContent = error.message;
    }
}

async function changeSalamander(action) {
    salamanderBusy = true;
    salamanderStart.disabled = true;
    salamanderOpen.disabled = true;
    salamanderStop.disabled = true;
    salamanderStatus.textContent = action === 'start' ? 'Spouštím…' : 'Ukončuji…';
    try {
        const response = await fetch('/api/salamander/' + action, {
            method: 'POST',
            headers: {'X-AI-Platform-Action': action},
            cache: 'no-store',
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || result.error || 'Operace selhala');
        salamanderBusy = false;
        updateSalamander(result);
    } catch (error) {
        salamanderBusy = false;
        await refreshSalamander();
        salamanderStatus.textContent = 'Chyba: ' + error.message;
    }
}

salamanderStart.addEventListener('click', () => changeSalamander('start'));
salamanderStop.addEventListener('click', () => changeSalamander('stop'));
salamanderOpen.addEventListener('click', () => {
    if (salamanderUrl && !salamanderOpen.disabled) {
        window.open(salamanderUrl, '_blank', 'noopener,noreferrer');
    }
});

</script>

</body>
</html>
