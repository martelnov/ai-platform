services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: ai_platform
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - ${AI_DATA_ROOT:-/AI/data}/postgres:/var/lib/postgresql

    networks:
      - control

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ai_platform -d ai_platform
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  control-plane:
    build:
      context: ./control-plane

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_platform
      DB_USER: ai_platform
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      MASTER_KEY_FILE: /run/secrets/master_key

    secrets:
      - postgres_password
      - master_key

    volumes:
      - type: bind
        source: /run/ai-platform
        target: /run/ai-platform
        read_only: true

    networks:
      - control
      - frontend

    ports:
      - "127.0.0.1:8080:8080"

  gateway-api:
    build:
      context: ./control-plane

    restart: unless-stopped

    command:
      - uvicorn
      - app.gateway_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ai_platform
      DB_USER: ai_platform
      DB_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - type: bind
        source: /run/ai-platform
        target: /run/ai-platform
        read_only: true

    networks:
      - control
      - gateway

secrets:
  postgres_password:
    file: /etc/ai-platform/secrets/postgres_password

  master_key:
    file: /etc/ai-platform/secrets/master.key

networks:
  control:
    name: ai-control
    internal: true

  frontend:
    name: ai-frontend

  gateway:
    name: ai-gateway
    internal: true
